# Publie le dossier maquettes/ sur GitHub Pages à chaque push.
name: Publier les maquettes

on:
  push:
    branches: [claude/magical-lamport-r79cox, main]
    paths: ["maquettes/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: maquettes
      - id: deployment
        uses: actions/deploy-pages@v4
